<!DOCTYPE html>
<html>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<body style="margin:0;padding:32px;background:#0F172A;color:#CBD5E1;color-scheme:dark;font-family:Inter,sans-serif">
<h1 style="color:#F1F5F9;text-align:center">Reports</h1>
<div id="list" style="max-width:800px;margin:auto"></div>
<script>
const reports = JSON.parse(localStorage.getItem("reports") || "[]");
document.getElementById("list").innerHTML = reports.map(r => `
<div style="background:#1E293B;padding:24px;border-radius:8px;margin-bottom:16px">
<p>${r.time.slice(0, 16).replace("T", " ")} &middot; ${(r.username || "").replace(/</g, "&lt;")}</p>
<p>URL: <a href="${r.url}" style="color:#60A5FA;word-break:break-all">${r.url}</a></p>
<p>Frame date: ${r.date || ""}</p>
<p style="white-space:pre-wrap">${r.details.replace(/</g, "&lt;")}</p>
</div>`).join("") || "<p style='text-align:center'>No reports yet</p>";
</script>
</body>
</html>
