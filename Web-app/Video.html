<!DOCTYPE html>
<html>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<body style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;background:#2B6CB0;color:#4A5568;font-family:Inter,sans-serif">
<h1 style="color:#EBF8FF">Space seer</h1>
<div style="display:flex;align-items:center;gap:32px">
<img id="view" style="border:2px solid #FFFFFF">
<div>
<p>Date: <span id="date"></span></p>
<p>Detector: <span id="detector"></span></p>
<p>Wavelength: <span id="wavelength"></span> µm</p>
<p>URL: <a id="url" style="color:#EBF8FF"></a></p>
<button style="background:#2B6CB0;color:#FFFFFF;border:none;padding:8px 16px;font-family:Inter" onclick="paused=!paused;this.textContent=paused?'Resume':'Pause'">Pause</button>
</div>
</div>
<script>
const API = "http://localhost:8000";
let images = [];
let i = 0;
let paused = false;
fetch(API + "/frames" + location.search)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(data => images = data);

setInterval(() => {
  if (!images.length || paused) return;
  const f = images[i];
  document.getElementById("view").src = API + f.image;
  document.getElementById("date").textContent = f.date;
  document.getElementById("detector").textContent = f.detector;
  document.getElementById("wavelength").textContent = f.wavelength_um;
  document.getElementById("url").textContent = f.url;
  document.getElementById("url").href = f.url;
  i = (i + 1) % images.length;
}, 2000);
</script>
</body>
</html>
