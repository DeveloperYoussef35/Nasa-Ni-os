<!DOCTYPE html>
<html>
<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
<body style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;margin:0;background:#90CDF4;color:#4A5568;font-family:Inter,sans-serif">
<h1 style="color:#2B6CB0;margin:0 0 48px">Space seer</h1>
<div style="display:flex;align-items:center;gap:32px">
<img id="view" style="border:2px solid #FFFFFF">
<div style="background:#FFFFFF;padding:24px;border-radius:8px">
<p>Date: <span id="date"></span></p>
<p>Detector: <span id="detector"></span></p>
<p>Wavelength: <span id="wavelength"></span> µm</p>
<p>URL: <a id="url" style="color:#2B6CB0"></a></p>
<button style="background:#2B6CB0;color:#FFFFFF;border:none;padding:8px 16px;font-family:Inter" onclick="paused=!paused;this.textContent=paused?'Resume':'Pause'">Pause</button>
</div>
</div>
<div onclick="report()" style="margin-top:32px;width:600px;padding:12px;background:#2B6CB0;color:#FFFFFF;text-align:center;border-radius:8px;cursor:pointer">Report</div>
<div id="pop" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#FFFFFF;padding:24px;border-radius:8px">
<span onclick="pop.style.display='none'" style="position:absolute;top:8px;right:12px;cursor:pointer">&times;</span>
<p id="popurl"></p>
<textarea placeholder="Details" rows="5" cols="40"></textarea>
<button style="display:block;margin-left:auto;background:#2B6CB0;color:#FFFFFF;border:none;padding:8px 16px;font-family:Inter">Submit</button>
</div>
<script>
function report() {
  popurl.textContent = document.getElementById("url").textContent;
  pop.style.display = "block";
}
document.onkeydown = e => {
  if (e.code === "Space" && pop.style.display !== "block") {
    e.preventDefault();
    report();
  }
};
const API = "http://localhost:8000";
let images = [];
let i = 0;
let paused = false;
fetch(API + "/frames" + location.search)
  .then(response => {
    if (!response.ok) {
      throw new Error('Network response was not ok');
    }
    return response.json();
  })
  .then(data => images = data);

setInterval(() => {
  if (!images.length || paused) return;
  const f = images[i];
  document.getElementById("view").src = API + f.image;
  document.getElementById("date").textContent = f.date;
  document.getElementById("detector").textContent = f.detector;
  document.getElementById("wavelength").textContent = f.wavelength_um;
  document.getElementById("url").textContent = f.url;
  document.getElementById("url").href = f.url;
  i = (i + 1) % images.length;
}, 2000);
</script>
</body>
</html>
